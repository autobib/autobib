[package]
name = "autobib"
authors = ["Alex Rutar <alex@rutar.org>", "Peiran Wu"]
description = "An automatic bibliography generation tool."
repository = "https://github.com/autobib/autobib"
homepage = "https://github.com/autobib/autobib"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["cli", "bibtex", "biblatex", "bibliography"]
categories = ["command-line-utilities"]
version = "0.7.0"
rust-version = "1.97.1"
edition = "2024"
exclude = [".github", ".markdownlint.yaml"]

[features]
default = ["bundled-sqlite", "typst"]
bundled-sqlite = ["rusqlite/bundled"]
typst = ["dep:typst-syntax"]
in_memory_database = []
read_response_cache = ["dep:bincode"]
write_response_cache = ["dep:bincode", "in_memory_database"]

[dependencies]
anyhow = "1.0"
autobib-entry = { version = "0.9.0", features = ["v0", "v1", "mutable"] }
bincode = { version = "2.0", optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap-verbosity-flag = "3.0"
clap_complete = "4.5"
crossterm = "0.29"
data-encoding = "2.9"
delegate = "0.13"
etcetera = "0.11"
itertools = "0.15"
libc = "0.2.177"
log = { version = "0.4", features = ["release_max_level_info"] }
memchr = "2.7"
mufmt = "0.5.2"
nonempty = "0.12"
nucleo-picker = "0.12.0"
ramify = "0.9.0"
rapidhash = "4.1"
regex = "1.11"
rsxiv = { version = "0.5.0", features = ["serde"] }
rusqlite = { version = "0.40", features = ["chrono", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_bibtex = "0.7.1"
serde_json = "1.0"
shell-words = "1.1"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.0"
typst-syntax = { version = "0.15", optional = true }
ureq = { version = "3.1", features = ["json", "socks-proxy"] }
walkdir = "2.5"
which = "8.0"

[dev-dependencies]
assert_cmd = "2.1.1"
assert_fs = "1.1"
predicates = "3.1"
boon = "0.6"

[profile.release]
lto = true
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.ci]
inherits = "dev"
opt-level = 1

[lints.clippy]
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
dbg_macro = "warn"
todo = "warn"
