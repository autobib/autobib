name: CI
# Run Rust tests and checks

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: 1
  RUST_VERSION: ${{ vars.RUST_VERSION }}

  REMOTES_FILE: tests/remotes.txt
  CACHE_FORMAT_DEF: src/http/cache/format.rs
  AUTOBIB_RESPONSE_CACHE_PATH: responses.dat
  CACHE_PREFIX: responses

jobs:
  dependency-licenses:
    uses: ./.github/workflows/cargo-about.yml

  tests:
    strategy:
      fail-fast: false
      matrix:
        image:
          [
            macos-latest,
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.image }}
    steps:
      # Windows configuration; this has to run before checkout!
      - name: Configure Git on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      # Load/create HTTP response cache
      - name: Set up response data cache
        id: response-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.AUTOBIB_RESPONSE_CACHE_PATH }}
          key: ${{ env.CACHE_PREFIX }}-${{ matrix.image }}-${{ hashFiles(env.REMOTES_FILE, env.CACHE_FORMAT_DEF) }}
      - name: Build response cache binary
        if: steps.response-cache.outputs.cache-hit != 'true'
        run: cargo build --profile=ci --locked --features write_response_cache
      - name: Create response cache
        if: steps.response-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo run --profile=ci --locked --features write_response_cache -- -vv source --retrieve-only --ignore-null "$REMOTES_FILE"

      # Actually run tests
      - name: Build test binaries
        run: cargo test --profile=ci --no-run --locked --features read_response_cache
      - name: Run tests
        run: cargo test --profile=ci --no-fail-fast --locked --features read_response_cache

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Rust doc/fmt/clippy
      - name: Build docs
        run: cargo doc --no-deps --locked
      - name: Run Clippy lints
        run: cargo clippy --locked --all-targets
      - name: Check formatting
        run: cargo fmt --check

      # Markdown lints
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: |
            **/*.md
            !target/**/*.md

      # Check remotes file formatting
      - name: Check remotes file is sorted
        shell: bash
        run: sort -C "$REMOTES_FILE"
      - name: Check remotes file contains no duplicates
        shell: bash
        run: test "$(uniq -d < "$REMOTES_FILE" | wc -l)" -eq 0

      # Check bash scripts
      - name: Checking contents of `scripts` directory
        shell: bash
        run: shellcheck scripts/*.sh --enable=all
