name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: 1
  RUST_VERSION: ${{ vars.RUST_VERSION }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # initialize the GitHub release as a draft
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the release version from the tag
        id: release
        if: env.VERSION == ''
        shell: bash
        run: |
          version="${RELEASE_TAG:1}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Show the version
        run: |
          echo "version is: $VERSION"

      - name: Check that tag version and Cargo.toml version are the same
        shell: bash
        run: |
          PACKAGE_VERSION="$(yq '.package.version' Cargo.toml)"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo >&2 "version does not match Cargo.toml"
            exit 1
          fi

      - name: Check that a changelog file with the correct name exists
        shell: bash
        run: |
          CHANGELOG_FILE="docs/changelog/$RELEASE_TAG.md"
          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo >&2 "Changelog file not found!"
            exit 1
          fi
          echo "CHANGELOG_FILE=$CHANGELOG_FILE" >> "$GITHUB_ENV"

      - name: Show the changelog file
        run: |
          echo "changelog file is: $CHANGELOG_FILE"

      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_exists="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2> /dev/null || true)"
          if [[ "$draft_exists" == "true" ]]; then
            echo "Draft release already exists; reusing it."
          else
            tail -n +2 "$CHANGELOG_FILE" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --prerelease --draft --verify-tag \
              --title "Autobib $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
    outputs:
      version: ${{ steps.release.outputs.version }}

  generate-licenses:
    needs: create-release
    uses: ./.github/workflows/cargo-about.yml

  upload-binary:
    name: Compile release binaries
    needs: [create-release, generate-licenses]
    runs-on: ${{ matrix.image }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - image: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - image: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - image: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - image: macos-latest
            target: aarch64-apple-darwin

          - image: macos-latest
            target: x86_64-apple-darwin

          - image: windows-latest
            target: x86_64-pc-windows-gnu

          - image: windows-latest
            target: x86_64-pc-windows-msvc

          - image: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # make sure this contains the toolchain version!
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install build deps (Linux musl)
        if: endsWith( matrix.target, '-unknown-linux-musl' )
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        shell: bash
        run: |
          cargo build --verbose --release --locked \
            --config 'target."cfg(all())".rustflags = ["-D", "warnings"]' \
            --target ${{ matrix.target }}
          if [[ "${{ runner.os }}" = "Windows" ]]; then
            bin="target/${{ matrix.target }}/release/autobib.exe"
          else
            bin="target/${{ matrix.target }}/release/autobib"
          fi
          echo "BIN=$bin" >> $GITHUB_ENV

      - name: Determine archive name
        shell: bash
        run: |
          version="${{ needs.create-release.outputs.version }}"
          echo "ARCHIVE=autobib-$version-${{ matrix.target }}" >> $GITHUB_ENV

      - name: Show variables
        shell: bash
        run: |
          echo "archive is: $ARCHIVE"
          echo "bin is: $BIN"

      - name: Download licenses file artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-about-licenses-html

      - name: Create directory for archive
        shell: bash
        run: |
          mkdir -p "$ARCHIVE"
          cp "$BIN" "$ARCHIVE"/
          cp {README.md,COPYRIGHT,LICENSE,third-party-licenses.html} "$ARCHIVE"/
          cp "docs/changelog/$RELEASE_TAG.md" "$ARCHIVE"/CHANGELOG.md

      - name: Build archive (Windows)
        shell: bash
        if: runner.os == 'Windows'
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
          echo "ASSET=$ARCHIVE.zip" >> "$GITHUB_ENV"
          echo "ASSET_SUM=$ARCHIVE.zip.sha256" >> "$GITHUB_ENV"

      - name: Build archive (Unix)
        shell: bash
        if: runner.os != 'Windows'
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload release archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET_SUM" --clobber

  publish-crates-io:
    name: Publish release to crates.io
    needs: [create-release, generate-licenses, upload-binary]
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # make sure this contains the toolchain version!
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Publish release
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-github-release:
    name: Publish GitHub release
    needs: [create-release, upload-binary, publish-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --verify-tag
